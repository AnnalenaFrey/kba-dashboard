[project]
name = "kba-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "psycopg[binary,pool]>=3.3.4",
    "pyaml-env>=1.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "requests>=2.34.2",
]

[project.scripts]
kba-dashboard = "kba_dashboard:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
